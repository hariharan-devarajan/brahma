stages: [alloc, test, deploy, cleanup]

# LC corona CI via a single shared Flux allocation:
#  - `allocate` creates ONE 1-node allocation and saves its Flux job id to
#    .flux-jobid (artifact) so ALL jobs in the pipeline share it globally.
#  - the test job reads the id and runs its steps ON the allocated node via
#    `flux proxy <jobid> flux run -N 1 ...`, inside podman containers that use
#    the same images as the GitHub Actions CI.
#  - `release-allocation` cancels it at the end (runs even on failure).
.corona-flux:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [shell, corona]
  variables:
    SMALL_QUEUE: pbatch
    SMALL_QUEUE_WALLTIME: 60

allocate:
  extends: .corona-flux
  stage: alloc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # flux alloc --bg submits the allocation and BLOCKS until it is granted
    # (no timeout — batch queues may take long), then returns leaving the
    # instance running in the background.
    # Unique per-job name: `flux job last` is user-global and races with
    # other pipelines running under the same LC account.
    - ALLOC_NAME=brahma-ci-$CI_PIPELINE_ID-$CI_JOB_ID
    - flux alloc --bg -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name="$ALLOC_NAME"
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    - echo "$JOBID" > .flux-jobid
    - echo "Created Flux allocation $JOBID (shared by all CI jobs)"
    - flux proxy "$JOBID" flux resource list
  artifacts:
    paths: [.flux-jobid]

# Build/test run inside docker.io/hdevarajan92/brahma-ci:latest (the GitHub CI
# image) with the spack load_env.sh environment; docs inside python:3.11.
build-test-docs:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - JOBID=$(cat .flux-jobid)
    # flux run -N 1 executes the script ON the allocated node.
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/ci/build-test-docs.sh
  artifacts:
    paths: [public]

# Publishes the artifact from build-test-docs — no allocation, no flux.
pages:
  extends: .corona-flux
  stage: deploy
  needs: [build-test-docs]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "gitlab-migration"'  # temporary: remove after merge to develop
  script:
    - echo "Publishing docs built by build-test-docs"
  artifacts:
    paths: [public]

release-allocation:
  extends: .corona-flux
  stage: cleanup
  # Runs last: alloc → build-test-docs → pages → deallocate. pages is optional
  # since it only exists on develop/gitlab-migration pipelines.
  needs: [allocate, build-test-docs, {job: pages, optional: true}]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  script:
    - test -s .flux-jobid && flux cancel "$(cat .flux-jobid)" || true
