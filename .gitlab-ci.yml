stages: [alloc, test, deploy, cleanup]

# LC corona CI via a single shared Flux allocation:
#  - `allocate` creates ONE 1-node allocation and saves its Flux job id to
#    .flux-jobid (artifact) so ALL jobs in the pipeline share it globally.
#  - every CI job reads the id and runs its steps via `flux proxy <jobid>`.
#  - `release-allocation` cancels it at the end (runs even on failure).
.corona-flux:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [shell, corona]
  variables:
    PYTHON_MODULE: python/3.13.2
    COMPILER_MODULE: gcc/11.2.1
    MPI_MODULE: mvapich2/2.3.7
    SMALL_QUEUE: pdebug
    SMALL_QUEUE_WALLTIME: 60

allocate:
  extends: .corona-flux
  stage: alloc
  rules:
    # Mirror the GitHub Actions filter: skip push pipelines for PR merge commits.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /Merge pull request/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # flux alloc --bg submits the allocation and BLOCKS until it is granted
    # (no timeout — batch queues may take long), then returns leaving the
    # instance running in the background.
    - flux alloc --bg -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name=brahma-ci
    - JOBID=$(flux job last)
    - echo "$JOBID" > .flux-jobid
    - echo "Created Flux allocation $JOBID (shared by all CI jobs)"
    - flux proxy "$JOBID" flux resource list
  artifacts:
    paths: [.flux-jobid]

# NOTE(gitlab-migration): the GitHub CI ran a 4-way hdf5×mpi spack matrix inside
# the hdevarajan92/brahma-ci container. On corona the toolchain comes from LC
# modules, so the matrix is collapsed to the module-provided
# mvapich2 + hdf5-parallel combination.
build-test-docs:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  rules:
    # Mirror the GitHub Actions filter: skip push pipelines for PR merge commits.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /Merge pull request/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - JOBID=$(cat .flux-jobid)
    - echo "Using shared Flux allocation $JOBID"
    # Each CI step runs on that allocation via flux proxy.
    - >
      flux proxy "$JOBID" bash -lc "
      module load $COMPILER_MODULE $PYTHON_MODULE $MPI_MODULE &&
      { module load hdf5-parallel || true; } &&
      export CC=gcc CXX=g++ &&
      if command -v h5pcc >/dev/null; then export HDF5_DIR=\$(dirname \$(dirname \$(command -v h5pcc))); fi &&
      export MPI_DIR=\$(dirname \$(dirname \$(command -v mpicc))) &&
      mkdir -p build &&
      cmake -Bbuild
      -DCMAKE_BUILD_TYPE=Debug
      -DBRAHMA_ENABLE_TESTING=ON
      -DBRAHMA_GENERATE_INTERFACES=OFF
      -DBRAHMA_BUILD_WITH_HDF5=ON
      -DBRAHMA_BUILD_WITH_MPI=ON
      -DHDF5_ROOT=\$HDF5_DIR
      -DMPI_ROOT=\$MPI_DIR
      -DBRAHMA_BUILD_DEPENDENCIES=ON"
    - >
      flux proxy "$JOBID" bash -lc "
      module load $COMPILER_MODULE $PYTHON_MODULE $MPI_MODULE &&
      { module load hdf5-parallel || true; } &&
      export CC=gcc CXX=g++ &&
      make -C build -j"
    - >
      flux proxy "$JOBID" bash -lc "
      module load $COMPILER_MODULE $PYTHON_MODULE $MPI_MODULE &&
      { module load hdf5-parallel || true; } &&
      ctest --test-dir build -VV"
    # Sphinx docs build (published by the pages job below).
    - >
      flux proxy "$JOBID" bash -lc "
      module load $PYTHON_MODULE &&
      python3 -m venv .venv-docs && source .venv-docs/bin/activate &&
      pip install -r docs/requirements.txt &&
      sphinx-build -b html docs public"
  artifacts:
    paths: [public]

# Publishes the artifact from build-test-docs — shell runner, no allocation.
pages:
  extends: .corona-flux
  stage: deploy
  needs: [build-test-docs]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "gitlab-migration"'  # temporary: remove after merge to develop
  script:
    - echo "Publishing docs built by build-test-docs"
  artifacts:
    paths: [public]

release-allocation:
  extends: .corona-flux
  stage: cleanup
  needs: [allocate, build-test-docs]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /Merge pull request/'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  script:
    - flux cancel "$(cat .flux-jobid)" || true
